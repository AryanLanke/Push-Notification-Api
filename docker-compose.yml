version: '3.8'

services:
  # Distributed in-memory broker & cache for persistent queue
  redis:
    image: redis:7-alpine
    container_name: notification_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Production relational database with persistent storage
  postgres:
    image: postgres:15-alpine
    container_name: notification_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: notifications
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Producer Notification API Microservice
  producer:
    build: ./producer
    container_name: notification_producer
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URI=postgresql://postgres:postgrespassword@postgres:5432/notifications
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=dev-secret-key-change-in-prod
      - PRODUCER_PORT=5000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Consumer Device Receiver & Dashboard
  consumer:
    build: ./consumer
    container_name: notification_consumer
    ports:
      - "5001:5001"
    environment:
      - PRODUCER_HOST=producer
      - PRODUCER_PORT=5000
      - API_KEY=dev-secret-key-change-in-prod
    depends_on:
      - producer
    command: [
      "python", "consumer.py",
      "--producer-host", "producer",
      "--host", "consumer",
      "--name", "Consumer-device",
      "--port", "5001",
      "--api-key", "dev-secret-key-change-in-prod"
    ]
    restart: unless-stopped

volumes:
  postgres_data:
